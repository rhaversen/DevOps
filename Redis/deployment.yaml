apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis-deployment
    namespace: redis
spec:
    replicas: 1
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: redis
    template:
        metadata:
            labels:
                app: redis
        spec:
            automountServiceAccountToken: false
            containers:
                - name: redis-container
                  image: redis:alpine
                  ports:
                      - containerPort: 6379
                  env:
                      - name: REDIS_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: redis-secrets
                                key: REDIS_PASSWORD
                  args:
                      - redis-server
                      - "--requirepass"
                      - "$(REDIS_PASSWORD)"
                  volumeMounts:
                      - name: data
                        mountPath: /data
            volumes:
                - name: data
                  emptyDir:
                      sizeLimit: "1Gi"
