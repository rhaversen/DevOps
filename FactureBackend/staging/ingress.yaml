apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: backend-ingress
    namespace: facture-staging
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
    ingressClassName: nginx
    tls:
        -   hosts:
                - staging.facture.live
            secretName: backend-tls
    rules:
        -   host: staging.facture.live
            http:
                paths:
                    # API Path: the homepage itself (facture-frontend) is served on / of the same host
                    -   path: /api/
                        pathType: Prefix
                        backend:
                            service:
                                name: backend-service
                                port:
                                    number: 80
