apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend-deployment
    namespace: facture-production
spec:
    replicas: 1
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: frontend-deployment
    template:
        metadata:
            labels:
                app: frontend-deployment
        spec:
            automountServiceAccountToken: false
            containers:
                -   name: frontend-deployment
                    image: "rhaversen/facture-frontend:d8e4d9f2a332f3b86b373905af7e2ab846f512e1"
                    imagePullPolicy: Always
                    envFrom:
                        -   secretRef:
                                name: frontend-secrets
                    ports:
                        -   containerPort: 3000
