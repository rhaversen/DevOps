apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend-deployment
    namespace: facture-production
spec:
    replicas: 1
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: frontend-deployment
    template:
        metadata:
            labels:
                app: frontend-deployment
        spec:
            automountServiceAccountToken: false
            containers:
                -   name: frontend-deployment
                    image: "rhaversen/facture-frontend:f3b17405d95322b3f6c0a3fce303c44b04370d7d"
                    imagePullPolicy: Always
                    envFrom:
                        -   secretRef:
                                name: frontend-secrets
                    ports:
                        -   containerPort: 3000
